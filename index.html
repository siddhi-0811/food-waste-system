<!DOCTYPE html>
<html>
<head>
    <title>Food Waste Reduction System</title>

    <style>
        html, body {
            height: 100%;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 0;

            background: url('bg.png') no-repeat center center fixed;
            background-size: cover;
        }

        /* Overlay */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;

            background: linear-gradient(
                rgba(0,0,0,0.45),
                rgba(0,0,0,0.25),
                rgba(0,0,0,0.15)
            );

            z-index: 0;
        }

        .content {
            position: relative;
            z-index: 1;
        }

        h1 {
            text-align: center;
            padding-top: 30px;
            color: white;
            text-shadow: 0px 4px 12px rgba(0,0,0,0.8);
        }

        .tagline {
            text-align: center;
            color: white;
            font-size: 18px;
            margin-top: -10px;
            font-style: italic;
            opacity: 0.95;
            letter-spacing: 1px;
        }

        .container {
            display: flex;
            justify-content: center;
            margin-top: 30px;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px);
            padding: 25px;
            width: 350px;
            border-radius: 15px;
            box-shadow: 0px 8px 25px rgba(0,0,0,0.4);
            transition: 0.3s;
            animation: fadeIn 1s ease-in;
        }

        .card:hover {
            transform: scale(1.03);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 10px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        button {
            width: 100%;
            margin-top: 15px;
            padding: 12px;
            background: #27ae60;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #1e8449;
        }

        #loading {
            display: none;
            margin-top: 10px;
            color: #2c3e50;
        }

        .result-card {
            margin-top: 20px;
            background: #ecf9f1;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }

        .highlight {
            font-size: 18px;
            font-weight: bold;
        }

        .high { color: red; }
        .medium { color: orange; }
        .low { color: green; }

    </style>
</head>

<body>

<div class="overlay"></div>

<div class="content">

    <h1>🍱 Food Waste Reduction System</h1>
    <p class="tagline">“Turning Waste into Worth” ♻️</p>

    <div class="container">
        <div class="card">

            <form id="foodForm">

                <label>Food Quantity (meals)</label>
                <input type="number" id="quantity" required>

                <label>Location</label>
                <input type="text" id="location" placeholder="e.g. Nashik" required>

                <label>Food Type</label>
                <select id="type">
                    <option>Veg</option>
                    <option>Non-Veg</option>
                </select>

                <label>Time Since Prepared (hours)</label>
                <input type="number" id="time" required>

                <button type="submit">Find Best Match 🚀</button>

                <p id="loading">🤖 AI is analyzing best match...</p>

            </form>
<a href="ngo.html">
    <button style="margin-top:15px;">Go to NGO Dashboard 🏢</button>
</a>
            <div id="result" class="result-card" style="display:none;">
                <p>Suggested NGOs:</p>
                <div id="ngoList"></div>

                <p>Urgency Level:</p>
                <p class="highlight" id="urgencyLevel"></p>
            </div>

        </div>
    </div>

    <!-- Impact Section -->
    <div style="text-align:center; margin-top:30px; color:white;">
        <h3>🌍 Impact</h3>
        <p>🍱 Meals Saved: 1200+</p>
        <p>👥 People Served: 800+</p>
    </div>

</div>

<script>
document.getElementById("foodForm").addEventListener("submit", function(e) {
    e.preventDefault();

    let quantity = parseInt(document.getElementById("quantity").value);
    let time = parseInt(document.getElementById("time").value);
    let location = document.getElementById("location").value.toLowerCase();

    let urgency = "Low";
    let urgencyClass = "low";

    if (quantity > 50 || time > 5) {
        urgency = "High";
        urgencyClass = "high";
    } 
    else if (quantity > 20) {
        urgency = "Medium";
        urgencyClass = "medium";
    }

    let ngo = "Helping Hands NGO";

    if (location.includes("nashik")) {
        ngo = "Nashik Food Bank";
    } 
    else if (location.includes("mumbai")) {
        ngo = "Mumbai Hunger Relief";
    } 
    else if (location.includes("pune")) {
        ngo = "Pune Food Rescue";
    }

    // Show loading
    document.getElementById("loading").style.display = "block";

    setTimeout(() => {

        document.getElementById("loading").style.display = "none";
        document.getElementById("result").style.display = "block";

        let ngos = [ngo, "Care Foundation", "Food Relief Trust"];

        let output = ngos.map(n => `<p>✅ ${n}</p>`).join("");
        document.getElementById("ngoList").innerHTML = output;

        let urgencyElement = document.getElementById("urgencyLevel");
        urgencyElement.innerText = urgency;
        urgencyElement.className = "highlight " + urgencyClass;

    }, 1500);
});
</script>

</body>
</html>
